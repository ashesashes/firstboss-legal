<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FirstBoss — Legal</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#1c1c1e;--muted:#6b6b70;--rule:#e3e3e6;--accent:#b4530a}
@media (prefers-color-scheme:dark){
  :root{--bg:#121214;--fg:#e8e8ea;--muted:#9a9aa0;--rule:#2c2c30;--accent:#ffb066}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:17px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%}
main{max-width:680px;margin:0 auto;padding:40px 22px 96px}
h1{font-size:29px;line-height:1.2;letter-spacing:-.02em;margin:0 0 6px}
h2{font-size:20px;line-height:1.3;letter-spacing:-.01em;margin:38px 0 10px;
  padding-top:22px;border-top:1px solid var(--rule)}
h2:first-of-type{border-top:0;padding-top:0}
p,ul{margin:0 0 16px}
ul{padding-left:22px}li{margin-bottom:7px}
a{color:var(--accent)}
hr{border:0;border-top:1px solid var(--rule);margin:28px 0}
strong{font-weight:640}
.eyebrow{color:var(--muted);font-size:15px;margin-bottom:26px}
.eyebrow a{color:var(--muted)}
table{width:100%;border-collapse:collapse;margin:0 0 20px;font-size:15px;display:block;
  overflow-x:auto;white-space:nowrap}
th,td{text-align:left;padding:9px 14px 9px 0;border-bottom:1px solid var(--rule);
  vertical-align:top}
th{font-weight:640;color:var(--muted);font-size:13px;letter-spacing:.03em;
  text-transform:uppercase}
footer{margin-top:52px;padding-top:20px;border-top:1px solid var(--rule);
  color:var(--muted);font-size:15px}
</style>
</head>
<body>
<main>
<h1>FirstBoss</h1>
<p class="eyebrow">An alarm you dismiss by winning a fight.</p>
<ul>
<li><a href="privacy/">Privacy Policy</a></li>
<li><a href="terms/">Terms of Use</a></li>
</ul>
<footer>Limitless Labs LLC · <a href="mailto:support@ottowrites.co">support@ottowrites.co</a></footer>
</main>
</body>
</html>
